<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Key — Stock & Fish</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif;color:#1f2937;background:#f3f6fb}
.top{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 4px 14px rgba(79,70,229,.25)}
.top h1{margin:0;font-size:20px;font-weight:700}
.top .me{display:flex;gap:10px;align-items:center;font-size:14px}
.badge{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#fff;color:#4f46e5}
.badge.sup{background:#fde68a;color:#78350f}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);border:1px solid #e5e7eb}
.card h2{margin:0 0 16px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#111827}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{border-radius:14px;padding:16px;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.stat:nth-child(2){background:linear-gradient(135deg,#10b981,#059669)}
.stat:nth-child(3){background:linear-gradient(135deg,#f59e0b,#d97706)}
.stat:nth-child(4){background:linear-gradient(135deg,#ef4444,#dc2626)}
.stat:nth-child(5){background:linear-gradient(135deg,#64748b,#475569)}
.stat:nth-child(6){background:linear-gradient(135deg,#0ea5e9,#0284c7)}
.stat .l{font-size:12px;opacity:.9}
.stat .v{font-size:26px;font-weight:800;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:20px;padding-bottom:22px;border-bottom:1px dashed #d1d5db}
.chart div{flex:1;background:linear-gradient(180deg,#818cf8,#4f46e5);border-radius:8px 8px 0 0;position:relative;min-height:6px}
.chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:#6b7280}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:#6b7280;font-weight:600}
input,select,textarea{background:#f9fafb;color:#111827;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:#4f46e5;transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:#eef2ff;color:#4338ca}
button.warn{background:#f59e0b;color:#fff}
button.bad{background:#ef4444;color:#fff}
button.sm{padding:6px 12px;font-size:12px}
button.full{width:100%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
textarea{min-height:110px;font-family:Consolas,monospace;resize:vertical}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input{flex:1;min-width:220px}
.filters select{width:auto}
.tablewrap{overflow:auto;max-height:500px;border:1px solid #e5e7eb;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 12px;text-align:left;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th{position:sticky;top:0;background:#f8fafc;color:#475569;font-weight:700}
tbody tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.t-active{background:#dcfce7;color:#15803d}
.t-locked{background:#fef3c7;color:#b45309}
.t-expired,.t-used{background:#fee2e2;color:#b91c1c}
.mut{color:#6b7280}
.acts{display:flex;gap:6px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;animation:up .3s ease;max-width:380px}
.toast.err{background:#b91c1c}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.login{max-width:400px;margin:12vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.1);border:1px solid #e5e7eb}
.login h2{margin:0 0 4px;font-size:20px}
.login .fld{margin-top:12px}
.login button{margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="top">
  <h1>🔑 Quản lý Key — Stock & Fish</h1>
  <div class="me" id="who"></div>
</div>

<section id="loginView" class="login">
  <h2>Đăng nhập quản trị</h2>
  <div class="mut">Dùng tài khoản admin trong game</div>
  <div class="fld"><label>Tên đăng nhập</label><input id="lName"></div>
  <div class="fld"><label>Mật khẩu</label><input id="lPass" type="password"></div>
  <button id="lBtn" class="full">Vào trang</button>
</section>

<main id="app" class="hidden">

  <div class="card">
    <h2>Thống kê <button class="ghost sm" id="reload">⟳ Làm mới</button></h2>
    <div class="stats" id="stats"></div>
    <div class="mut" style="margin-top:18px;font-size:12px">Số key tạo trong 14 ngày gần nhất</div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <h2>Tạo key mới</h2>
    <div class="form">
      <div class="fld"><label>Loại</label>
        <select id="kType">
          <option value="xu">Xu (cộng xu)</option>
          <option value="buff">Buff (sát thương)</option>
          <option value="vip">VIP (danh hiệu)</option>
        </select></div>
      <div class="fld"><label>Giá trị</label><input id="kValue" type="number" value="50000"></div>
      <div class="fld"><label>Số lượng (tối đa 200)</label><input id="kCount" type="number" value="1" min="1" max="200"></div>
      <div class="fld"><label>Hạn (ngày, 0 = không)</label><input id="kDays" type="number" value="0" min="0"></div>
      <div class="fld"><label>Số lượt dùng</label><input id="kMax" type="number" value="1" min="1"></div>
      <div class="fld"><label>Tiền tố</label>
        <select id="kPrefix">
          <option value="VIPSUPER">VIPSUPER-</option>
          <option value="HONGQUAN">HONGQUAN-</option>
        </select></div>
      <div class="fld"><label>Gắn tài khoản (tùy chọn)</label><input id="kBound"></div>
      <div class="fld"><label>&nbsp;</label><button id="kMake">＋ Tạo key</button></div>
    </div>
    <div style="margin-top:16px"><textarea id="kOut" readonly placeholder="Key vừa tạo sẽ hiện ở đây"></textarea></div>
    <div style="margin-top:8px"><button class="ghost sm" id="kCopy">Sao chép tất cả</button></div>
  </div>

  <div class="card">
    <h2>Danh sách key</h2>
    <div class="filters">
      <input id="fSearch" placeholder="Tìm mã, người tạo, tài khoản gắn">
      <select id="fType"><option value="">Mọi loại</option><option value="xu">xu</option><option value="buff">buff</option><option value="vip">vip</option></select>
      <select id="fStatus"><option value="">Mọi trạng thái</option><option value="active">Hoạt động</option><option value="locked">Đã khóa</option><option value="expired">Hết hạn</option><option value="used">Hết lượt</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Mã</th><th>Loại</th><th>Giá trị</th><th>Trạng thái</th><th>Lượt</th><th>Hạn</th><th>Gắn TK</th><th>Tạo bởi</th><th>Thao tác</th></tr></thead>
        <tbody id="kBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API='https://script.google.com/macros/s/AKfycbxWjJjYsgyLci4teWEdzp7SocLfpO9WnmwErbyq1-ZB2NYurcVftXgE0WjvTR2WLhh15A/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('vi-VN');
const STATUS={active:'Hoạt động',locked:'Đã khóa',expired:'Hết hạn',used:'Hết lượt'};
let ME=null, KEYS=[];

function toast(msg,err){
  const t=document.createElement('div');
  t.className='toast'+(err?' err':'');t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
async function api(body){
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
  catch(e){throw new Error('Không kết nối được máy chủ')}
  let j;
  try{j=await r.json()}catch(e){throw new Error('Máy chủ trả về sai định dạng')}
  if(!j.ok){const e=new Error(j.error||'Lỗi');e.code=j.code;throw e}
  return j;
}
const call=(op,extra={})=>api({action:'admin',name:ME.name,pass:ME.pass,op,...extra});
async function run(btn,fn){
  if(btn){btn.disabled=true;if(!btn.querySelector('.spin'))btn.insertAdjacentHTML('beforeend','<span class="spin"></span>')}
  try{return await fn()}
  catch(e){toast(e.message||'Lỗi',true);return null}
  finally{if(btn){btn.disabled=false;const s=btn.querySelector('.spin');if(s)s.remove()}}
}

$('lBtn').onclick=()=>run($('lBtn'),async()=>{
  const name=$('lName').value.trim(),pass=$('lPass').value;
  if(!name||!pass)return toast('Nhập tên và mật khẩu',true);
  const j=await api({action:'login',name,pass});
  if(j.role!=='admin'&&j.role!=='superadmin')throw new Error('Tài khoản không có quyền');
  ME={name,pass,role:j.role};
  sessionStorage.setItem('kc',JSON.stringify(ME));
  enter();
});
['lName','lPass'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('lBtn').click()}));

function enter(){
  $('loginView').classList.add('hidden');
  $('app').classList.remove('hidden');
  const sup=ME.role==='superadmin';
  $('who').innerHTML=`<span>${esc(ME.name)}</span><span class="badge ${sup?'sup':''}">${sup?'Super admin':'Admin'}</span><button class="ghost sm" id="out">Thoát</button>`;
  $('out').onclick=()=>{sessionStorage.removeItem('kc');location.reload()};
  load();
}

async function load(){
  const j=await call('keyList');
  KEYS=j.keys;
  $('stats').innerHTML=[
    ['Tổng key',j.total],['Đang hoạt động',j.active],['Hết lượt',j.soldOut],
    ['Hết hạn',j.expired],['Bị khóa',j.locked],['Lượt đã dùng',j.usedTotal]
  ].map(x=>`<div class="stat"><div class="l">${x[0]}</div><div class="v">${fmt(x[1])}</div></div>`).join('');
  const max=Math.max(1,...j.chart.map(c=>c.n));
  $('chart').innerHTML=j.chart.map(c=>`<div style="height:${Math.max(6,c.n/max*100)}%" title="${c.d}: ${c.n} key"><span>${c.d}</span></div>`).join('');
  renderKeys();
}
function renderKeys(){
  const q=$('fSearch').value.trim().toLowerCase(),ty=$('fType').value,st=$('fStatus').value;
  const sup=ME.role==='superadmin';
  const rows=KEYS.filter(k=>
    (!q||(k.code+' '+k.createdBy+' '+k.bound).toLowerCase().includes(q))&&
    (!ty||k.type===ty)&&(!st||k.status===st));
  $('kBody').innerHTML=rows.map(k=>`<tr>
    <td><b>${esc(k.code)}</b></td>
    <td>${esc(k.type)}</td>
    <td>${k.type==='buff'?'x'+k.value:fmt(k.value)}</td>
    <td><span class="tag t-${esc(k.status)}">${STATUS[k.status]||esc(k.status)}</span></td>
    <td>${k.uses}/${k.maxUses}</td>
    <td class="mut">${esc(k.expires||'Không hạn')}</td>
    <td>${esc(k.bound||'—')}</td>
    <td class="mut">${esc(k.createdBy)}</td>
    <td><div class="acts">
      <button class="ghost sm" onclick="toggleKey('${esc(k.code)}','${k.status==='locked'?'active':'locked'}',this)">${k.status==='locked'?'Mở khóa':'Khóa'}</button>
      ${sup?`<button class="warn sm" onclick="upgradeKey('${esc(k.code)}',this)">Nâng cấp</button>
      <button class="bad sm" onclick="deleteKey('${esc(k.code)}',this)">Xóa</button>`:''}
    </div></td></tr>`).join('')||'<tr><td colspan="9" class="mut" style="text-align:center;padding:24px">Chưa có key nào</td></tr>';
}
['fSearch','fType','fStatus'].forEach(id=>$(id).addEventListener('input',renderKeys));
$('reload').onclick=()=>run($('reload'),load);

$('kMake').onclick=()=>run($('kMake'),async()=>{
  const j=await call('keyCreate',{
    type:$('kType').value,value:Number($('kValue').value),count:Number($('kCount').value),
    days:Number($('kDays').value),maxUses:Number($('kMax').value),
    prefix:$('kPrefix').value,bound:$('kBound').value.trim()
  });
  $('kOut').value=j.codes.join('\n');
  toast(j.message);
  load();
});
$('kCopy').onclick=()=>{navigator.clipboard.writeText($('kOut').value);toast('Đã sao chép')};

async function toggleKey(code,status,btn){
  await run(btn,async()=>{const j=await call('keyStatus',{code,status});toast(j.message);load()});
}
async function deleteKey(code,btn){
  if(!confirm('Xóa key '+code+'?'))return;
  await run(btn,async()=>{const j=await call('keyDelete',{code});toast(j.message);load()});
}
async function upgradeKey(code,btn){
  const v=prompt('Giá trị mới (để trống nếu không đổi):','');
  if(v===null)return;
  const d=prompt('Gia hạn thêm bao nhiêu ngày (0 nếu không):','0');
  if(d===null)return;
  const m=prompt('Số lượt tối đa mới (0 nếu không):','0');
  if(m===null)return;
  await run(btn,async()=>{
    const j=await call('keyUpgrade',{code,value:v||'',addDays:Number(d)||0,maxUses:Number(m)||0});
    toast(j.message);load();
  });
}

const saved=sessionStorage.getItem('kc');
if(saved){try{ME=JSON.parse(saved);enter()}catch(e){sessionStorage.removeItem('kc')}}
</script>
</body>
</html>
