<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Key — Stock & Fish</title>
<style>
*{box-sizing:border-box}
:root{--bg1:#0f172a;--bg2:#1e293b;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
body{margin:0;min-height:100vh;color:var(--txt);font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),#111827 60%,#0b1120)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 22px;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:800;color:#fff}
header h1 span{color:var(--acc)}
.me{display:flex;gap:8px;align-items:center;color:var(--mut)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.sup{background:#f59e0b;color:#111}
.badge.adm{background:var(--acc);color:#071521}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h2{margin:0 0 14px;font-size:15px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .l{color:var(--mut);font-size:12px}
.stat .v{font-size:24px;font-weight:800;margin-top:4px;color:#fff}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:18px;padding-bottom:20px}
.chart div{flex:1;background:linear-gradient(180deg,var(--acc),#0369a1);border-radius:6px 6px 2px 2px;position:relative;min-height:4px}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fld label{font-size:12px;color:var(--mut)}
input,select,textarea{background:#0f172a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.2)}
button{cursor:pointer;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;color:#fff;background:var(--acc);color:#071521;transition:transform .1s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.1)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.warn{background:var(--warn);color:#111}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:5px 10px;font-size:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:rot .7s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
textarea{width:100%;min-height:110px;font-family:Consolas,monospace;resize:vertical}
.tablewrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#0f172a;color:var(--mut);font-weight:700}
tbody tr:hover td{background:#0f2238}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.t-active{background:rgba(34,197,94,.18);color:#4ade80}
.t-locked{background:rgba(245,158,11,.18);color:#fbbf24}
.t-expired,.t-used{background:rgba(239,68,68,.18);color:#f87171}
.mut{color:var(--mut)}
.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;border:1px solid var(--acc);border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:up .3s ease;max-width:360px}
.toast.err{border-color:var(--bad)}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.login h2{margin:0 0 4px;color:#fff}
.login .fld{width:100%;margin-top:10px}
.login button{width:100%;margin-top:14px;padding:12px}
.hidden{display:none!important}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1>🔑 Quản lý <span>Key</span></h1>
  <div class="me" id="who"></div>
</header>

<!-- ĐĂNG NHẬP -->
<section id="loginView" class="login">
  <h2>Đăng nhập quản trị</h2>
  <div class="mut">Dùng tài khoản admin trong game</div>
  <div class="fld"><label>Tên đăng nhập</label><input id="lName"></div>
  <div class="fld"><label>Mật khẩu</label><input id="lPass" type="password"></div>
  <button id="lBtn">Vào trang</button>
</section>

<main id="app" class="hidden">

  <div class="card">
    <h2>Thống kê <button class="ghost sm" id="reload">⟳ Làm mới</button></h2>
    <div class="grid" id="stats"></div>
    <div class="mut" style="margin-top:14px;font-size:12px">Số key tạo trong 14 ngày gần nhất</div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <h2>Tạo key</h2>
    <div class="form">
      <div class="fld"><label>Loại</label>
        <select id="kType">
          <option value="xu">Xu (cộng xu)</option>
          <option value="buff">Buff (sát thương)</option>
          <option value="vip">VIP (danh hiệu)</option>
        </select></div>
      <div class="fld"><label>Giá trị</label><input id="kValue" type="number" value="50000"></div>
      <div class="fld"><label>Số lượng (tối đa 200)</label><input id="kCount" type="number" value="1" min="1" max="200"></div>
      <div class="fld"><label>Hạn (ngày, 0 = không)</label><input id="kDays" type="number" value="0" min="0"></div>
      <div class="fld"><label>Số lượt dùng</label><input id="kMax" type="number" value="1" min="1"></div>
      <div class="fld"><label>Tiền tố</label>
        <select id="kPrefix">
          <option value="VIPSUPER">VIPSUPER-</option>
          <option value="HONGQUAN">HONGQUAN-</option>
        </select></div>
      <div class="fld" style="flex:1;min-width:200px"><label>Gắn tài khoản (tùy chọn)</label><input id="kBound"></div>
      <button id="kMake">Tạo key</button>
    </div>
    <div style="margin-top:14px"><textarea id="kOut" readonly placeholder="Key vừa tạo sẽ hiện ở đây"></textarea></div>
    <div style="margin-top:8px"><button class="ghost sm" id="kCopy">Sao chép</button></div>
  </div>

  <div class="card">
    <h2>Danh sách key</h2>
    <div class="filters">
      <input id="fSearch" placeholder="Tìm mã, người tạo, tài khoản gắn" style="flex:1;min-width:220px">
      <select id="fType"><option value="">Mọi loại</option><option value="xu">xu</option><option value="buff">buff</option><option value="vip">vip</option></select>
      <select id="fStatus"><option value="">Mọi trạng thái</option><option value="active">Hoạt động</option><option value="locked">Đã khóa</option><option value="expired">Hết hạn</option><option value="used">Hết lượt</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Mã</th><th>Loại</th><th>Giá trị</th><th>Trạng thái</th><th>Lượt</th><th>Hạn</th><th>Gắn TK</th><th>Tạo bởi</th><th>Thao tác</th></tr></thead>
        <tbody id="kBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API='https://script.google.com/macros/s/AKfycbxWjJjYsgyLci4teWEdzp7SocLfpO9WnmwErbyq1-ZB2NYurcVftXgE0WjvTR2WLhh15A/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('vi-VN');
const STATUS={active:'Hoạt động',locked:'Đã khóa',expired:'Hết hạn',used:'Hết lượt'};
let ME=null, KEYS=[];

function toast(msg,err){
  const t=document.createElement('div');
  t.className='toast'+(err?' err':'');t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
async function api(body){
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
  catch(e){throw new Error('Không kết nối được máy chủ')}
  let j;
  try{j=await r.json()}catch(e){throw new Error('Máy chủ trả về sai định dạng')}
  if(!j.ok){const e=new Error(j.error||'Lỗi');e.code=j.code;throw e}
  return j;
}
const call=(op,extra={})=>api({action:'admin',name:ME.name,pass:ME.pass,op,...extra});
async function run(btn,fn){
  if(btn){btn.disabled=true;if(!btn.querySelector('.spin'))btn.insertAdjacentHTML('beforeend','<span class="spin"></span>')}
  try{return await fn()}
  catch(e){toast(e.message||'Lỗi',true);return null}
  finally{if(btn){btn.disabled=false;const s=btn.querySelector('.spin');if(s)s.remove()}}
}

/* Đăng nhập */
$('lBtn').onclick=()=>run($('lBtn'),async()=>{
  const name=$('lName').value.trim(),pass=$('lPass').value;
  if(!name||!pass)return toast('Nhập tên và mật khẩu',true);
  const j=await api({action:'login',name,pass});
  if(j.role!=='admin'&&j.role!=='superadmin')throw new Error('Tài khoản không có quyền');
  ME={name,pass,role:j.role};
  sessionStorage.setItem('kc',JSON.stringify(ME));
  enter();
});
['lName','lPass'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('lBtn').click()}));

function enter(){
  $('loginView').classList.add('hidden');
  $('app').classList.remove('hidden');
  const sup=ME.role==='superadmin';
  $('who').innerHTML=`<span>${esc(ME.name)}</span><span class="badge ${sup?'sup':'adm'}">${sup?'SUPER ADMIN':'ADMIN'}</span><button class="ghost sm" id="out">Thoát</button>`;
  $('out').onclick=()=>{sessionStorage.removeItem('kc');location.reload()};
  load();
}

/* Tải dữ liệu */
async function load(){
  const j=await call('keyList');
  KEYS=j.keys;
  $('stats').innerHTML=[
    ['Tổng key',j.total],['Đang hoạt động',j.active],['Hết lượt',j.soldOut],
    ['Hết hạn',j.expired],['Bị khóa',j.locked],['Lượt đã dùng',j.usedTotal]
  ].map(x=>`<div class="stat"><div class="l">${x[0]}</div><div class="v">${fmt(x[1])}</div></div>`).join('');
  const max=Math.max(1,...j.chart.map(c=>c.n));
  $('chart').innerHTML=j.chart.map(c=>`<div style="height:${Math.max(4,c.n/max*100)}%" title="${c.d}: ${c.n} key"><span>${c.d}</span></div>`).join('');
  renderKeys();
}
function renderKeys(){
  const q=$('fSearch').value.trim().toLowerCase(),ty=$('fType').value,st=$('fStatus').value;
  const sup=ME.role==='superadmin';
  const rows=KEYS.filter(k=>
    (!q||(k.code+' '+k.createdBy+' '+k.bound).toLowerCase().includes(q))&&
    (!ty||k.type===ty)&&(!st||k.status===st));
  $('kBody').innerHTML=rows.map(k=>`<tr>
    <td><b>${esc(k.code)}</b></td>
    <td>${esc(k.type)}</td>
    <td>${k.type==='buff'?'x'+k.value:fmt(k.value)}</td>
    <td><span class="tag t-${esc(k.status)}">${STATUS[k.status]||esc(k.status)}</span></td>
    <td>${k.uses}/${k.maxUses}</td>
    <td class="mut">${esc(k.expires||'Không hạn')}</td>
    <td>${esc(k.bound||'—')}</td>
    <td class="mut">${esc(k.createdBy)}</td>
    <td style="display:flex;gap:6px">
      <button class="ghost sm" onclick="toggleKey('${esc(k.code)}','${k.status==='locked'?'active':'locked'}',this)">${k.status==='locked'?'Mở':'Khóa'}</button>
      ${sup?`<button class="warn sm" onclick="upgradeKey('${esc(k.code)}',this)">Nâng</button>
      <button class="bad sm" onclick="deleteKey('${esc(k.code)}',this)">Xóa</button>`:''}
    </td></tr>`).join('')||'<tr><td colspan="9" class="mut" style="text-align:center;padding:20px">Chưa có key nào</td></tr>';
}
['fSearch','fType','fStatus'].forEach(id=>$(id).addEventListener('input',renderKeys));
$('reload').onclick=()=>run($('reload'),load);

/* Thao tác */
$('kMake').onclick=()=>run($('kMake'),async()=>{
  const j=await call('keyCreate',{
    type:$('kType').value,value:Number($('kValue').value),count:Number($('kCount').value),
    days:Number($('kDays').value),maxUses:Number($('kMax').value),
    prefix:$('kPrefix').value,bound:$('kBound').value.trim()
  });
  $('kOut').value=j.codes.join('\n');
  toast(j.message);
  load();
});
$('kCopy').onclick=()=>{navigator.clipboard.writeText($('kOut').value);toast('Đã sao chép')};

async function toggleKey(code,status,btn){
  await run(btn,async()=>{const j=await call('keyStatus',{code,status});toast(j.message);load()});
}
async function deleteKey(code,btn){
  if(!confirm('Xóa key '+code+'?'))return;
  await run(btn,async()=>{const j=await call('keyDelete',{code});toast(j.message);load()});
}
async function upgradeKey(code,btn){
  const v=prompt('Giá trị mới (để trống nếu không đổi):','');
  if(v===null)return;
  const d=prompt('Gia hạn thêm bao nhiêu ngày (0 nếu không):','0');
  if(d===null)return;
  const m=prompt('Số lượt tối đa mới (0 nếu không):','0');
  if(m===null)return;
  await run(btn,async()=>{
    const j=await call('keyUpgrade',{code,value:v||'',addDays:Number(d)||0,maxUses:Number(m)||0});
    toast(j.message);load();
  });
}

const saved=sessionStorage.getItem('kc');
if(saved){try{ME=JSON.parse(saved);enter()}catch(e){sessionStorage.removeItem('kc')}}
</script>
</body>
</html>
